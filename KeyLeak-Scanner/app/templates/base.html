<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KeyLeak Scanner{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #141413;
      --light: #faf9f5;
      --orange: #d97757;
      --border: #e5e2d9;
      --critical: #b3261e;
      --high: #d97757;
      --medium: #8a7a3f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--light);
      color: var(--dark);
      font-family: 'Lora', Georgia, serif;
      line-height: 1.55;
    }
    h1, h2, h3 { font-family: 'Poppins', sans-serif; margin: 0 0 0.4em; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
    header.top { border-bottom: 2px solid var(--dark); padding-bottom: 16px; margin-bottom: 32px; }
    header.top a { color: var(--dark); text-decoration: none; }
    header.top h1 { font-size: 1.5rem; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
    }
    label { display: block; font-weight: 600; font-family: 'Poppins', sans-serif; margin-bottom: 8px; font-size: 0.9rem; }
    input[type=url] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Lora', serif;
    }
    button {
      background: var(--orange);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { opacity: 0.92; }
    .finding {
      border-left: 4px solid var(--medium);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .finding.critical { border-left-color: var(--critical); background: #fdf3f2; }
    .finding.high { border-left-color: var(--high); }
    .finding.medium { border-left-color: var(--medium); }
    .badge {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: 100px;
      color: #fff;
    }
    .badge.critical { background: var(--critical); }
    .badge.high { background: var(--high); }
    .badge.medium { background: var(--medium); }
    .finding .provider { font-family: 'Poppins', sans-serif; font-weight: 700; margin-left: 8px; }
    .finding .snippet { font-family: ui-monospace, monospace; background: #f3f1ea; padding: 2px 6px; border-radius: 4px; font-size: 0.88rem; }
    .finding .location { font-size: 0.82rem; color: #6b6a63; word-break: break-all; margin-top: 8px; }
    .finding .reason { margin-top: 8px; font-size: 0.92rem; }
    .meta { color: #6b6a63; font-size: 0.88rem; margin-bottom: 24px; }
    .empty { color: #4a7c3c; font-weight: 600; }
    .errors { font-size: 0.82rem; color: #8a6a3f; margin-top: 24px; }
    footer { margin-top: 48px; font-size: 0.8rem; color: #948f80; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top"><a href="/"><h1>🔑 KeyLeak Scanner</h1></a></header>
    {% block content %}{% endblock %}
    <footer>Passive scanner — fetches publicly served assets only. No credentials stored.</footer>
  </div>
</body>
</html>
